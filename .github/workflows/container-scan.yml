name: Container scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ci-cd-blueprint:scan
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  trivy:
    name: Scan image for known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Produce SARIF report
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/work" \
            --workdir /work \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --format sarif \
              --output trivy-results.sarif \
              --exit-code 0 \
              "$IMAGE_TAG"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Fail on fixable high or critical findings
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$IMAGE_TAG"
